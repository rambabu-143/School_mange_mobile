plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'com.google.devtools.ksp'  version "$ksp_version"
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
}


android {
    ndkVersion "$ndk_version"

    buildFeatures {
        dataBinding true
        viewBinding true
        buildConfig true
    }

    signingConfigs {
        release {
            keyAlias 'key0'
            keyPassword 'mount@123'
            storeFile file('keystore.jks')
            storePassword 'mount@123'
            v1SigningEnabled true
            v2SigningEnabled true
        }

    }
    defaultConfig {
        applicationId 'com.mountcarmelschools'
        minSdk 24
        targetSdk 35
        compileSdk 35
        versionCode 72
        versionName "4.7.1"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    base {
        archivesName = "app-v${defaultConfig.versionName}(${defaultConfig.versionCode})"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            signingConfig signingConfigs.release
            buildConfigField "String", "ServerClientId", '"531308145809-7hf2v0bk9j4d5fe6i7om5gv7ud3qgmia.apps.googleusercontent.com"'

            ndk {
                debugSymbolLevel "FULL"
            }
        }

        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            buildConfigField "String", "ServerClientId", '"531308145809-7hf2v0bk9j4d5fe6i7om5gv7ud3qgmia.apps.googleusercontent.com"'

            signingConfig signingConfigs.release


        }
    }

    dataBinding {
        enabled = true
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    kapt {
        correctErrorTypes true
    }
    namespace 'com.mountcarmelschools'
    lint {
        abortOnError false
        checkReleaseBuilds false
    }

}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'androidx.constraintlayout:constraintlayout-solver:1.1.3'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.0'
    implementation 'com.google.firebase:firebase-messaging:23.0.6'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.5.0'
    implementation 'com.google.android.play:app-update-ktx:2.1.0'
    implementation 'com.google.android.gms:play-services-maps:18.1.0'
//    implementation 'androidx.fragment:fragment-ktx:1.8.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

    implementation 'com.applandeo:material-calendar-view:1.9.2'

    implementation 'androidx.biometric:biometric:1.2.0-alpha05' // Use the latest version available

    //CircleImage
    implementation 'de.hdodenhof:circleimageview:3.1.0'

    //switch Button
    implementation 'com.github.zcweng:switch-button:0.0.3@aar'

    //Material Designing
    implementation 'com.google.android.material:material:1.7.0-alpha02'

    //dimension
    implementation 'com.intuit.sdp:sdp-android:1.0.6'
    implementation 'com.intuit.ssp:ssp-android:1.0.6'


    //Retrofit
    implementation 'com.squareup.moshi:moshi-kotlin:1.15.1'
    implementation 'com.squareup.retrofit2:retrofit:2.6.1'
    implementation "com.squareup.retrofit2:converter-moshi:2.5.0"
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.2'
    implementation 'com.squareup.okhttp3:okhttp:4.9.2'
    ksp 'com.squareup.moshi:moshi-kotlin-codegen:1.15.1'
    implementation 'com.squareup.moshi:moshi-kotlin:1.15.1'

    implementation 'com.sealwu.jsontokotlin:library:3.6.1'
    //Glide
    implementation 'com.github.bumptech.glide:glide:4.11.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.11.0'

    //Gson
    implementation 'com.google.code.gson:gson:2.8.9'


//    implementation 'sun.bob:mcalendarview:1.0.0'

   implementation 'me.dm7.barcodescanner:zxing:1.9.8'

    implementation 'com.google.android.gms:play-services-auth:20.4.1'
    implementation 'com.google.android.gms:play-services-auth-api-phone:18.0.1'

    implementation 'com.github.afreakyelf:Pdf-Viewer:v1.0.7'


    // implementation('com.github.mhiew:android-pdf-viewer:3.2.0-beta.3') {
    //     exclude group: 'com.github.mhiew', module: 'pdfium-android'
    // }
    // implementation 'com.github.appuraja1:PdfiumAndroid-16kb:v2.4'
    // implementation 'com.github.asadwaheed1:AndroidPdfViewer:v3.2.0-beta06'
    implementation 'com.github.zacharee:AndroidPdfViewer:4.0.1'

    implementation 'com.google.guava:guava:31.1-android'


    implementation 'com.google.firebase:firebase-crashlytics-ktx:18.3.3'
    implementation 'com.google.firebase:firebase-analytics-ktx:21.2.0'

    implementation(project(path: ":mistoryview"))

    implementation("org.jsoup:jsoup:1.15.1")
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompilationTask.class).configureEach {
    compilerOptions.languageVersion =
            org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_1_9
}